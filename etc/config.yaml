# Default configuration for the Matrix engine.

Loader:
  Providers:
    # By default, Matrix discovers components from <provider>/<component>/dsl.
    # The base path is relative to the application's working directory.
    - Type: "file"
      Args: ["."]

    # If a component stores DSL files in a child directory, declare it explicitly.
    # Example:
    # - Type: "file"
    #   Args: ["."]
    #   ComponentRoots:
    #     module_a: "code"
    #     module_b: "code"
  
  # Directory to scan for endpoint definition files.
  EndpointsPath: "endpoints"

Scheduler:
  # Use the "ants" goroutine pool-based scheduler.
  Type: "ants"
  # Default number of worker goroutines.
  PoolSize: 100

Trace:
  # Enable the trace aspect by default.
  # This will automatically record execution snapshots for all rule chains.
  EnableAop: true
